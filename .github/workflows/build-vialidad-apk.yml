name: Build Vialidad Tecoman APK
on:
  push:
    branches: [ "vialidad-secure-apk" ]
    paths:
      - 'vialidad-apk/**'
      - '.github/workflows/build-vialidad-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vialidad-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Vialidad-Tecoman-1.0.0-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vialidad-Tecoman-APK
          path: vialidad-apk/app/build/outputs/apk/release/Vialidad-Tecoman-1.0.0-unsigned.apk
          if-no-files-found: error
